# Project CEO Harness - Multi-Project 24/7 Deployment
#
# This compose supports running the harness against MULTIPLE projects at once.
# Example:
#   docker compose --profile pipe up -d     # Your existing project
#   docker compose --profile new up -d      # A brand new project
#
# Each profile has completely isolated state (brain, conversations, Kanban).

services:
  # =====================================================
  # Profile: pipe  → Your existing PIPE-OS project
  # =====================================================
  ceo-pipe:
    profiles: ["pipe"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ceo-pipe
    restart: unless-stopped
    env_file:
      - ${PIPE_ENV_FILE:-examples/pipe-project/.env.example}
    environment:
      - PROJECT_NAME=pipe-os
      - TARGET_PROJECT_PATH=/workspace
    volumes:
      - pipe_state:/app/state
      - pipe_brain_logs:/app/brain/conversations
      - pipe_kanban:/app/mgmt
      - ${PIPE_TARGET:-.}:/workspace:ro
      - shared_work:/shared
    networks:
      - ceo-network
    command: ["python", "/app/entrypoint.py"]

  # =====================================================
  # Profile: new  → Brand new project you're starting
  # =====================================================
  ceo-new:
    profiles: ["new"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ceo-new
    restart: unless-stopped
    env_file:
      - ${NEW_ENV_FILE:-examples/new-project/.env.example}
    environment:
      - PROJECT_NAME=my-new-idea
      - TARGET_PROJECT_PATH=/workspace
    volumes:
      - new_state:/app/state
      - new_brain_logs:/app/brain/conversations
      - new_kanban:/app/mgmt
      - ${NEW_TARGET:-.}:/workspace:ro
      - shared_work:/shared
    networks:
      - ceo-network
    command: ["python", "/app/entrypoint.py"]

  # Shared brain: real GBrain HTTP MCP server.
  # Upstream does not publish garrytan/gbrain:latest; build from source and run
  # `gbrain serve --http` instead.
  brain:
    profiles: ["pipe", "new"]
    build:
      context: .
      dockerfile: docker/Dockerfile.gbrain
    container_name: gbrain
    restart: unless-stopped
    environment:
      - GBRAIN_PORT=8000
      - GBRAIN_BIND=0.0.0.0
      - GBRAIN_PUBLIC_URL=http://localhost:8000
    volumes:
      - brain_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ceo-network

volumes:
  pipe_state:
  pipe_brain_logs:
  pipe_kanban:
  new_state:
  new_brain_logs:
  new_kanban:
  shared_work:
  brain_data:

networks:
  ceo-network:
    driver: bridge
