<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-screen flex flex-col bg-neutral-950 text-neutral-200 antialiased">
  <!-- Top bar: project + domain switchers, cost meter, kill switch -->
  <header class="flex items-center gap-3 px-4 py-2.5 border-b border-neutral-800 bg-neutral-900/60 backdrop-blur">
    <div class="flex items-center gap-2 text-sm font-semibold tracking-tight text-neutral-100">
      <span class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_2px_rgba(239,68,68,0.6)]"></span>
      CEO&nbsp;Studio
    </div>
    <div class="w-px h-5 bg-neutral-800 mx-1"></div>
    <select id="project-switcher"
            class="bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1 text-sm text-neutral-200 focus:outline-none focus:ring-1 focus:ring-red-500/50">
      <option value="">Select project…</option>
    </select>
    <select id="domain-switcher"
            class="bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1 text-sm text-neutral-200 focus:outline-none focus:ring-1 focus:ring-red-500/50">
      <option value="All">All domains</option>
    </select>
    <button id="add-project"
            class="text-sm bg-neutral-100 text-neutral-900 hover:bg-white rounded-md px-3 py-1 font-medium transition">+ Project</button>

    <div class="flex-1"></div>

    <!-- Live cost meter -->
    <div id="meter" class="text-xs font-mono px-3 py-1 rounded-md border border-neutral-700 bg-neutral-800/50 text-neutral-300">
      session $0.0000 / $5 · day $0.0000 / $20
    </div>
    <button id="kill"
            class="text-sm bg-red-600/90 hover:bg-red-600 text-white rounded-md px-3 py-1 font-medium transition">Kill</button>

    <!-- CEO (Hermes) status pill -->
    <div id="ceo-status" title="Hermes CEO daemon"
         class="flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded-md border border-neutral-700 bg-neutral-800/50 text-neutral-400">
      <span id="ceo-dot" class="w-2 h-2 rounded-full bg-neutral-600"></span>
      <span id="ceo-label">CEO …</span>
    </div>
    <button id="toggle-dashboard"
            class="text-sm bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-100 rounded-md px-3 py-1 font-medium transition">Dashboard</button>
  </header>

  <!-- Agent presence -->
  <div class="flex flex-col items-center py-4 gap-2">
    <div class="relative">
      <div id="agent-circle" class="agent-circle w-16 h-16 rounded-full bg-red-500"></div>
    </div>
    <!-- Live voice call control -->
    <button id="live-call"
            class="flex items-center gap-2 text-sm bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-100 rounded-full px-4 py-1.5 font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
      <span id="live-call-icon">🎙️</span><span id="live-call-label">Start live voice</span>
    </button>
    <div id="voice-status" class="text-xs text-neutral-500 h-4"></div>
    <div id="provider-note" class="text-xs text-neutral-600"></div>
  </div>

  <!-- Two agent-controlled panels -->
  <main class="flex-1 flex min-h-0 px-3 pb-3 gap-3">
    <section id="panel1"
             class="flex-1 overflow-auto p-4 rounded-xl border border-neutral-800 bg-neutral-900/40 prose-invert">
      <div class="text-neutral-600 text-sm">Panel 1 — open a project to begin.</div>
    </section>
    <section id="panel2"
             class="flex-1 overflow-auto p-4 rounded-xl border border-neutral-800 bg-neutral-900/40 flex flex-col">
      <div id="panel2-stream" class="flex-1 overflow-auto text-sm whitespace-pre-wrap leading-relaxed"></div>
      <div class="mt-3 flex gap-2 items-center">
        <input id="chat-input"
               class="flex-1 bg-neutral-800/70 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-1 focus:ring-red-500/50"
               placeholder="Type to the Project CEO… or use live voice above" />
        <button id="send"
                class="bg-red-600 hover:bg-red-500 text-white rounded-lg px-4 py-2 text-sm font-medium transition">Send</button>
      </div>
    </section>
  </main>

  <!-- CEO Dashboard overlay: live view of the Hermes Kanban board, swarm, and room -->
  <div id="dashboard" class="hidden fixed inset-0 z-40 bg-neutral-950/97 backdrop-blur-sm flex flex-col">
    <div class="flex items-center gap-3 px-4 py-2.5 border-b border-neutral-800 bg-neutral-900/70">
      <span class="text-sm font-semibold tracking-tight text-neutral-100">CEO Dashboard</span>
      <select id="dash-board"
              class="bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1 text-sm text-neutral-200 focus:outline-none focus:ring-1 focus:ring-red-500/50"></select>
      <div id="dash-ceo" class="flex items-center gap-1.5 text-xs font-mono px-2.5 py-1 rounded-md border border-neutral-700 bg-neutral-800/50 text-neutral-400">
        <span id="dash-ceo-dot" class="w-2 h-2 rounded-full bg-neutral-600"></span><span id="dash-ceo-label">CEO …</span>
      </div>
      <div id="dash-stats" class="text-xs font-mono text-neutral-400"></div>
      <div class="flex-1"></div>
      <span id="dash-updated" class="text-[11px] text-neutral-600 font-mono"></span>
      <button id="dash-config-btn" class="text-sm bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-100 rounded-md px-3 py-1 transition">⚙ Config</button>
      <button id="dash-refresh" class="text-sm bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-100 rounded-md px-3 py-1 transition">Refresh</button>
      <button id="dash-close" class="text-sm bg-neutral-100 text-neutral-900 hover:bg-white rounded-md px-3 py-1 font-medium transition">Close</button>
    </div>

    <!-- Config panel (overlay within the dashboard) -->
    <div id="config-panel" class="hidden absolute inset-0 z-50 bg-neutral-950/95 backdrop-blur flex items-start justify-center pt-16">
      <div class="w-[520px] max-w-[92vw] rounded-2xl border border-neutral-800 bg-neutral-900 shadow-2xl p-5 space-y-5">
        <div class="flex items-center">
          <span class="text-base font-semibold text-neutral-100">CEO Config</span>
          <div class="flex-1"></div>
          <button id="config-close" class="text-sm text-neutral-400 hover:text-neutral-100">✕</button>
        </div>

        <!-- CEO daemon control -->
        <div class="rounded-xl border border-neutral-800 bg-neutral-900/60 p-3.5">
          <div class="flex items-center gap-2">
            <span id="config-ceo-dot" class="w-2.5 h-2.5 rounded-full bg-neutral-600"></span>
            <span id="config-ceo-label" class="text-sm text-neutral-200">CEO …</span>
            <div class="flex-1"></div>
            <button id="config-gw-start" class="text-xs bg-emerald-600/90 hover:bg-emerald-600 text-white rounded-md px-3 py-1 font-medium transition">Start</button>
            <button id="config-gw-stop" class="text-xs bg-red-600/90 hover:bg-red-600 text-white rounded-md px-3 py-1 font-medium transition">Stop</button>
          </div>
          <div id="config-platforms" class="mt-2 text-[11px] font-mono text-neutral-500"></div>
        </div>

        <!-- Model / provider -->
        <div class="rounded-xl border border-neutral-800 bg-neutral-900/60 p-3.5 space-y-3">
          <div class="text-xs uppercase tracking-wider text-neutral-500">Brain — model & provider</div>
          <div id="config-current" class="text-[12px] font-mono text-neutral-400"></div>
          <div class="flex gap-2">
            <label class="flex-1 text-xs text-neutral-400">Provider
              <select id="config-provider" class="mt-1 w-full bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1.5 text-sm text-neutral-100 focus:outline-none focus:ring-1 focus:ring-red-500/50"></select>
            </label>
            <label class="flex-1 text-xs text-neutral-400">Model
              <select id="config-model" class="mt-1 w-full bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1.5 text-sm text-neutral-100 focus:outline-none focus:ring-1 focus:ring-red-500/50"></select>
            </label>
          </div>
          <div class="flex items-center gap-2">
            <button id="config-apply" class="text-sm bg-red-600 hover:bg-red-500 text-white rounded-md px-4 py-1.5 font-medium transition">Apply</button>
            <span id="config-msg" class="text-xs text-neutral-500"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-1 flex min-h-0">
      <!-- Kanban board -->
      <div class="flex-1 min-w-0 flex flex-col">
        <div class="px-3 py-1.5 text-[11px] uppercase tracking-wider text-neutral-500 border-b border-neutral-800/60">Kanban Board</div>
        <div id="dash-kanban" class="flex-1 overflow-x-auto overflow-y-hidden flex gap-3 p-3"></div>
      </div>
      <!-- Right rail: swarm + room -->
      <div class="w-[360px] shrink-0 border-l border-neutral-800 flex flex-col min-h-0">
        <div class="px-3 py-1.5 text-[11px] uppercase tracking-wider text-neutral-500 border-b border-neutral-800/60">Swarm</div>
        <div id="dash-swarm" class="max-h-[40%] overflow-auto p-3 space-y-2"></div>
        <div class="px-3 py-1.5 text-[11px] uppercase tracking-wider text-neutral-500 border-y border-neutral-800/60">Room — live activity</div>
        <div id="dash-room" class="flex-1 overflow-auto p-3 space-y-1.5 text-xs font-mono"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
  <script type="module" src="convai.js"></script>
</body>
</html>
