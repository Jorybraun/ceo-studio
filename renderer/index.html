<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEO Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-screen flex flex-col bg-neutral-950 text-neutral-200 antialiased">
  <!-- Top bar: project + domain switchers, cost meter, kill switch -->
  <header class="flex items-center gap-3 px-4 py-2.5 border-b border-neutral-800 bg-neutral-900/60 backdrop-blur">
    <div class="flex items-center gap-2 text-sm font-semibold tracking-tight text-neutral-100">
      <span class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_2px_rgba(239,68,68,0.6)]"></span>
      CEO&nbsp;Studio
    </div>
    <div class="w-px h-5 bg-neutral-800 mx-1"></div>
    <select id="project-switcher"
            class="bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1 text-sm text-neutral-200 focus:outline-none focus:ring-1 focus:ring-red-500/50">
      <option value="">Select project…</option>
    </select>
    <select id="domain-switcher"
            class="bg-neutral-800/70 border border-neutral-700 rounded-md px-2 py-1 text-sm text-neutral-200 focus:outline-none focus:ring-1 focus:ring-red-500/50">
      <option value="All">All domains</option>
    </select>
    <button id="add-project"
            class="text-sm bg-neutral-100 text-neutral-900 hover:bg-white rounded-md px-3 py-1 font-medium transition">+ Project</button>

    <div class="flex-1"></div>

    <!-- Live cost meter -->
    <div id="meter" class="text-xs font-mono px-3 py-1 rounded-md border border-neutral-700 bg-neutral-800/50 text-neutral-300">
      session $0.0000 / $5 · day $0.0000 / $20
    </div>
    <button id="kill"
            class="text-sm bg-red-600/90 hover:bg-red-600 text-white rounded-md px-3 py-1 font-medium transition">Kill</button>
  </header>

  <!-- Agent presence -->
  <div class="flex flex-col items-center py-4 gap-2">
    <div class="relative">
      <div id="agent-circle" class="agent-circle w-16 h-16 rounded-full bg-red-500"></div>
    </div>
    <!-- Live voice call control -->
    <button id="live-call"
            class="flex items-center gap-2 text-sm bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-100 rounded-full px-4 py-1.5 font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
      <span id="live-call-icon">🎙️</span><span id="live-call-label">Start live voice</span>
    </button>
    <div id="voice-status" class="text-xs text-neutral-500 h-4"></div>
    <div id="provider-note" class="text-xs text-neutral-600"></div>
  </div>

  <!-- Two agent-controlled panels -->
  <main class="flex-1 flex min-h-0 px-3 pb-3 gap-3">
    <section id="panel1"
             class="flex-1 overflow-auto p-4 rounded-xl border border-neutral-800 bg-neutral-900/40 prose-invert">
      <div class="text-neutral-600 text-sm">Panel 1 — open a project to begin.</div>
    </section>
    <section id="panel2"
             class="flex-1 overflow-auto p-4 rounded-xl border border-neutral-800 bg-neutral-900/40 flex flex-col">
      <div id="panel2-stream" class="flex-1 overflow-auto text-sm whitespace-pre-wrap leading-relaxed"></div>
      <div class="mt-3 flex gap-2 items-center">
        <input id="chat-input"
               class="flex-1 bg-neutral-800/70 border border-neutral-700 rounded-lg px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-1 focus:ring-red-500/50"
               placeholder="Type to the Project CEO… or use live voice above" />
        <button id="send"
                class="bg-red-600 hover:bg-red-500 text-white rounded-lg px-4 py-2 text-sm font-medium transition">Send</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script type="module" src="convai.js"></script>
</body>
</html>
